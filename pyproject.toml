[project]
name = "astrophage"
version = "0.1.0"
description = "MCP server for the calculations in P. K. Nag, sections 4.1 through 5.8"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
astrophage = "astrophage.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrophage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
